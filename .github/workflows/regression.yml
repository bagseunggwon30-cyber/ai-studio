name: Model-free regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Full Python tests, progress board and JavaScript syntax
        run: python -X utf8 -B tools/dev/regression.py --report reports/regression.json
      - name: Supervisor stdio roundtrip with fake models
        run: python -X utf8 -B tools/dev/supervisor_smoke.py --report reports/supervisor-fake.json
      - name: Publish sanitized counts and evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-evidence
          path: reports/*.json
          if-no-files-found: warn
