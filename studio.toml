# AI Studio 회사 설정 — CEO가 직접 고치는 파일입니다.
# 바꾼 뒤에는 감독 프로그램(python studio.py serve)을 다시 시작하세요.

[studio]
name = "AI 스튜디오"
tagline = "1인 AI 게임 스튜디오"
port = 8765
# true면 '준비' 상태 작업을 순서대로 알아서 실행합니다. 대시보드 상단 스위치로도 바꿀 수 있습니다.
auto_run = false

[limits]
task_timeout_min = 20            # 에이전트 1회 실행 제한 시간(분)
max_attempts = 2                 # 작업당 개발 시도: 초안 1회 + 수정 1회
max_children_per_plan = 8        # 지시 하나에서 나오는 최대 작업 수
max_runs_per_day = 40            # 하루 에이전트 실행 횟수 안전망 (구독 한도와는 별개)
max_agent_minutes_per_day = 240  # 하루 에이전트 실행 시간 안전망(분)
review_diff_max_chars = 60000    # 리뷰어에게 보내는 diff 최대 길이
qa_timeout_min = 5               # 검증 명령 1개 제한 시간(분)

[goals]
# 퀘스트 보드 위쪽 종이와 완성작 명판에 보입니다. 이번 주 목표는 화면에서도 고칠 수 있습니다.
week = "코어 쿠리어 완성"
month = 5                        # 이번 달 완성작 목표 수

[tools]
godot = 'S:\software\Godot_4.7.2\Godot_v4.7.2-stable_win64_console.exe'
godot_version = "4.7.2"
python = ""                      # 비우면 감독 프로그램과 같은 파이썬

[runtimes.codex]
# 비우면 설치된 Codex CLI 중 가장 새 버전을 자동으로 고릅니다 (Codex 앱 번들 CLI 포함).
path = ""
# 전역 ~/.codex/config.toml(MCP 서버·플러그인·full-access 기본값)을 무시하고 깨끗하게 실행합니다.
# 로그인 정보는 그대로 씁니다. API 키는 쓰지 않습니다.
ignore_user_config = true
extra_config = [
  'windows.sandbox="elevated"',
  'forced_login_method="chatgpt"',
  'memories.generate_memories=false',
  'memories.use_memories=false',
]

[runtimes.claude]
path = ""
tools = "Read,Grep,Glob"         # 리뷰어는 읽기 도구만

# ---- 직원(역할) ----
# runtime: codex | claude,  sandbox: read-only | workspace-write
# name: 화면 이름, character: 그림(hana|sol|clo|luna), memo: 상태창 한마디, skills: 보유 스킬 (최대 6개)
# 꾸미기(의상·머리색·옷 색·키·체격)는 화면의 직원 상태창에서 바꾸고 data/looks.json에 저장됩니다.
[roles.producer]
title = "기획 담당"
name = "하나"
character = "hana"
memo = "재밌게 나눠 볼게요!"
skills = ["기획서", "일정 나누기"]
avatar = "기"
description = "CEO 지시를 검증 가능한 작업 카드로 나눕니다. 파일은 수정하지 않습니다."
runtime = "codex"
model = "gpt-6-luna"
effort = "high"
sandbox = "read-only"

[roles.builder]
title = "개발 담당"
name = "솔"
character = "sol"
memo = "좋은 게임을 만들고 싶어요!"
skills = ["Godot", "GDScript"]
avatar = "개"
description = "작업 폴더(worktree) 안에서 허용된 파일만 고칩니다."
runtime = "codex"
model = "gpt-6-sol"
effort = "high"
sandbox = "workspace-write"

[roles.reviewer]
title = "리뷰 담당"
name = "클로"
character = "clo"
memo = "꼼꼼히 볼게요."
skills = ["코드 리뷰", "테스트 읽기"]
avatar = "리"
description = "다른 회사 모델로 변경 내용을 읽기 전용 검토합니다. 안 되면 Codex 별도 세션으로 대신합니다."
runtime = "claude"
model = ""                       # 비우면 Claude 계정 기본 모델
effort = ""
fallback_runtime = "codex"
fallback_model = "gpt-6-sol"
sandbox = "read-only"

[roles.analyst]
title = "리서치·문서 담당"
name = "루나"
character = "luna"
memo = "궁금한 건 찾아올게요."
skills = ["자료 조사", "보고서"]
avatar = "문"
description = "출처가 달린 리서치 보고서와 문서를 씁니다."
runtime = "codex"
model = "gpt-6-luna"
effort = "high"
sandbox = "workspace-write"
web_search = true
