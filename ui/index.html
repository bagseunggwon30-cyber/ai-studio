<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="studio-token" content="__STUDIO_TOKEN__">
  <title>AI 스튜디오</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/popups.css">
  <link rel="stylesheet" href="/board.css">
  <link rel="stylesheet" href="/workbench.css">
  <link rel="stylesheet" href="/modern.css">
  <link rel="stylesheet" href="/media.css">
  <link rel="stylesheet" href="/rooms.css">
  <link rel="stylesheet" href="/popups-a.css">
  <link rel="stylesheet" href="/popups-b.css">
  <link rel="stylesheet" href="/popups-c.css">
  <link rel="stylesheet" href="/gateway.css">
</head>
<body>
  <div id="stage" class="view-board">

    <!-- ① 화면 바탕: 홈 · 진행판 · 이미지·영상 작업대 · 소설 집필실 · 디자인 작업실 (board.js가 채운다). 스크립트가 늦거나 실패해도 처음부터 이 모던 바탕만 보인다 -->
    <div class="layer" id="layer-board" data-name="① 모던 화면"></div>

    <!-- ② 긴급 정지: 붉은 조명, 경광등, 가운데 배너 -->
    <div class="layer" id="layer-alarm" hidden>
      <div class="alarm-tint"></div>
      <div class="alarm-glow"></div>
      <div class="beacon" aria-hidden="true"><span class="beam"></span><img src="/assets/ui/beacon.png" alt="" draggable="false"></div>
      <div class="alarm-banner" role="alert">
        <svg class="tri" viewBox="0 0 76 64" aria-hidden="true"><path d="M38 4L72 60H4Z" fill="#2a1a24" stroke="#ff4d55" stroke-width="5" stroke-linejoin="round"/><path d="M38 22V42" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="38" cy="51" r="4" fill="#fff"/></svg>
        <h2>긴급 정지 · 모든 작업 멈춤</h2>
        <p class="alarm-reason" id="alarm-reason"></p>
        <button class="btn go" type="button" data-action="resume">재개</button>
      </div>
    </div>

    <!-- ③ 팝업: popups.js가 채운다 -->
    <div class="layer" id="layer-popup" data-name="③ 팝업" hidden>
      <div class="scrim"></div>
      <div id="popup-host"></div>
    </div>

    <!-- ④ 상단 바·알림·하단 명령창 -->
    <div class="layer" id="layer-ui" data-name="④ 상단 바·명령창">
      <header class="hud">
        <div class="brand">
          <img class="logo" src="/assets/ui/icon-logo.png" alt="" draggable="false">
          <span class="company" id="hud-company"></span>
          <span class="clock" id="hud-clock"></span>
        </div>

        <!-- 빠른 찾기 (Ctrl K): 일·직원·스킬·화면. 결과는 finder.js가 아래 목록에 채운다 -->
        <div class="hud-search" id="finder" role="search">
          <svg class="hs-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="board-search" type="text" autocomplete="off" spellcheck="false" placeholder="일 · 직원 · 스킬 · 화면 찾기" aria-label="빠른 찾기" role="combobox" aria-expanded="false" aria-controls="finder-list" aria-autocomplete="list">
          <kbd aria-hidden="true">Ctrl K</kbd>
          <div class="finder-list" id="finder-list" role="listbox" aria-label="찾은 것" hidden></div>
        </div>

        <button class="energy" type="button" data-action="energy" aria-describedby="energy-tip">
          <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6Z"/></svg>
          <span class="bar"><span class="fill" id="hud-energy-fill"></span></span>
          <span class="energy-text" id="hud-energy-text"></span>
        </button>

        <div class="hud-right">
          <button class="icon-btn phone-btn" type="button" data-action="remote" aria-label="휴대폰 연결" title="휴대폰 연결">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
          </button>
          <button class="icon-btn" type="button" data-action="inbox" aria-label="결재함" title="결재함">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M4 7.5l8 6 8-6"/></svg>
            <span class="badge" id="hud-inbox" hidden></span>
          </button>
          <button class="icon-btn" type="button" data-action="alerts" aria-label="알림" title="알림">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15Z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>
            <span class="badge dot" id="hud-alerts" hidden></span>
          </button>
          <button class="icon-btn fx-btn" type="button" data-action="motion" aria-pressed="true" aria-label="효과 켜짐 · 누르면 끄기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3.5l1.7 4.8 4.8 1.7-4.8 1.7-1.7 4.8-1.7-4.8L4 10l4.8-1.7Z"/><path d="M18.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8Z"/></svg>
          </button>
          <button class="icon-btn snd-btn" type="button" data-action="sound" aria-pressed="false" aria-label="소리 꺼짐 · 누르면 켜기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4Z"/><path class="wave" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
          </button>
          <button class="stop-btn" type="button" data-action="stop" aria-label="긴급 정지" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg>
            <span class="stop-text">긴급 정지</span>
          </button>
        </div>
      </header>

      <div class="tip" id="energy-tip" role="tooltip" hidden></div>

      <div class="offline" id="offline" role="status" hidden>
        <span class="offline-dot" aria-hidden="true"></span>
        <span>감독 프로그램과 연결이 끊겼어요 · 다시 연결하는 중…</span>
      </div>

      <!-- 새 버전 알림: 서버가 켜진 뒤 감독 프로그램 코드가 바뀌었다 (studio.restart) -->
      <!-- 한도·로그인 만료로 멈춤: 누르면 '다른 아이디로 로그인' 창 (studio/login.py) -->
      <button class="login-note" id="login-note" type="button" data-action="login" hidden>
        <span class="login-dot" aria-hidden="true"></span>
        <span id="login-note-text">사용 한도가 다 됐어요 · 눌러서 다른 아이디로 로그인</span>
      </button>

      <div class="restart-note" id="restart-note" role="status" hidden>
        <span class="restart-dot" aria-hidden="true"></span>
        <span>새 버전이 있어요 · AI 스튜디오를 껐다 켜 주세요</span>
      </div>

      <button class="notice hidden" id="notice" type="button" data-action="notice">
        <span class="face" id="notice-face" aria-hidden="true"></span>
        <span class="notice-text" id="notice-text"></span>
      </button>

      <form class="command" id="command" autocomplete="off">
        <button class="project-chip" id="project-chip" type="button" data-action="project" hidden></button>
        <input id="command-input" type="text" maxlength="4000" placeholder="무엇을 시킬까요?" aria-label="지시 입력">
        <button class="send" type="submit" aria-label="보내기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5"/></svg>
        </button>
      </form>
    </div>
  </div>

  <section id="workbench-screen" hidden aria-label="노드 편집기"></section>
  <script src="/data.js"></script>
  <script src="/sound.js"></script>
  <script src="/effects.js"></script>
  <script src="/looks.js"></script>
  <script src="/stills.js"></script>
  <script src="/popups.js"></script>
  <script src="/puppet.js"></script>
  <script src="/home.js"></script>
  <script src="/media.js"></script>
  <script src="/rooms.js"></script>
  <script src="/gateway.js"></script>
  <script src="/board.js"></script>
  <script src="/finder.js"></script>
  <script src="/workbench.js"></script>
  <script src="/app.js"></script>
</body>
</html>
