<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해변 캐릭터 움직임</title><link rel="stylesheet" href="preview.css"><script src="puppet.js" defer></script><script src="preview.js" defer></script></head>
<body><main><section class="figure"><div id="puppet" aria-label="양발로 선 해변 캐릭터"></div></section><section class="controls"><p class="eyebrow">AI STUDIO · 캐릭터 미리보기</p><h1>편안하게 서서,<br>자연스럽게 움직이기</h1><p>눈 깜박임과 말하기, 머리카락 흔들림,<br>형태를 유지한 작은 움직임과 가벼운 체중 이동.</p><div class="buttons"><button id="idle">편안한 움직임</button><button id="talk">말하기</button><button id="point">가볍게 기울기</button><button id="pause">정지</button></div><div class="buttons"><button id="pose-left">왼쪽 자세 확인</button><button id="pose-right">오른쪽 자세 확인</button></div><label for="eyes">눈 뜨기</label><input id="eyes" type="range" min="0" max="100" value="100"><label for="mouth">입 벌리기</label><input id="mouth" type="range" min="0" max="100" value="0"><p id="status" role="status">그림을 준비하고 있어요.</p><p class="note">마우스를 따라 고개를 조금 돌립니다.<br>움직임을 끄면 고정된 모습으로 돌아옵니다.<br>자체 2D 엔진용이며 Cubism 모델 파일은 아닙니다.</p></section></main></body></html>
